name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      PERSISTENT_SIGNING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test development signing safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_development_signing.py'

      - name: Test update release metadata
        run: python3 -m unittest discover -s .github/scripts -p 'test_update_manifest.py'

      - name: Check Noiser theme resources and contrast
        run: python3 .github/scripts/check_noiser_theme.py

      - name: Prepare persistent development key
        id: signing
        if: env.PERSISTENT_SIGNING == 'true'
        env:
          NOISER_DEBUG_KEYSTORE_BASE64: ${{ secrets.NOISER_DEBUG_KEYSTORE_BASE64 }}
        run: >-
          python3 .github/scripts/development-signing.py prepare
          --keystore "$RUNNER_TEMP/noiser-development.jks"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload restore Seeker/Seeker.csproj

      - name: Restore packages
        run: dotnet restore Seeker/Seeker.csproj -p:AndroidKeyStore=false

      - name: Install required Android SDK components
        run: >-
          dotnet build Seeker/Seeker.csproj -t:InstallAndroidDependencies --no-restore
          -p:AndroidKeyStore=false
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AndroidInstallJavaDependencies=false
          -p:AcceptAndroidSdkLicenses=true

      - name: Build APK with persistent development key
        if: env.PERSISTENT_SIGNING == 'true'
        run: >-
          dotnet build Seeker/Seeker.csproj --configuration Debug --no-restore
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="${{ steps.signing.outputs.keystore }}"
          -p:AndroidSigningKeyAlias=androiddebugkey
          -p:AndroidSigningKeyPass=android
          -p:AndroidSigningStorePass=android
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Build validation APK with disposable key
        if: env.PERSISTENT_SIGNING != 'true'
        run: >-
          dotnet build Seeker/Seeker.csproj --configuration Debug --no-restore
          -p:AndroidKeyStore=false
          -p:EmbedAssembliesIntoApk=true
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Verify Media3 Java callback contracts
        run: python3 .github/scripts/check_media3_contracts.py

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find Seeker/bin/Debug -type f -name '*-Signed.apk' -print -quit)
          if [ -z "$apk_path" ]; then
            echo '::error::The build did not produce a signed debug APK.'
            exit 1
          fi
          if [ "$PERSISTENT_SIGNING" = "true" ]; then
            python3 .github/scripts/development-signing.py verify-apk --apk "$apk_path"
            install -D "$apk_path" "$RUNNER_TEMP/noiser-apk/Noiser.apk"
            cp .github/noiser-development-certificate.sha256 "$RUNNER_TEMP/noiser-apk/signing-certificate.sha256"
            python3 .github/scripts/update-manifest.py --apk "$RUNNER_TEMP/noiser-apk/Noiser.apk" --manifest Seeker/Properties/AndroidManifest.xml --output "$RUNNER_TEMP/noiser-apk/Noiser-update.json"
          else
            install -D "$apk_path" "$RUNNER_TEMP/noiser-apk/Noiser-validation.apk"
          fi

      - name: Upload update-compatible APK
        if: env.PERSISTENT_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Noiser-apk
          path: ${{ runner.temp }}/noiser-apk/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload validation APK
        if: env.PERSISTENT_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Noiser-validation-apk
          path: ${{ runner.temp }}/noiser-apk/Noiser-validation.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove runner signing key
        if: always() && env.PERSISTENT_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/noiser-development.jks"

  publish-update:
    name: Publish verified Noiser update
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'miacadaver/Noiser'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Require passing host tests before publishing
        run: dotnet test UnitTestCommon/UnitTestCommon.csproj --configuration Release --filter 'TestCategory!=RealData' -p:MSBuildEnableWorkloadResolver=false --verbosity minimal

      - uses: actions/download-artifact@v4
        with:
          name: Noiser-apk
          path: ${{ runner.temp }}/noiser-release

      - name: Publish a complete release for a new app version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/noiser-release"
          release_version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["VersionName"])' "$release_directory/Noiser-update.json")
          release_tag="noiser-$release_version"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/noiser-release-draft.txt" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/noiser-release-draft.txt")" = "false" ]; then
              echo "This app version already has a published release; keeping its assets unchanged."
              exit 0
            fi
            gh release upload "$release_tag" "$release_directory/Noiser.apk" "$release_directory/Noiser-update.json" "$release_directory/signing-certificate.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" "$release_directory/Noiser.apk" "$release_directory/Noiser-update.json" "$release_directory/signing-certificate.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Noiser $release_version" --notes-file docs/latest-release-notes.md --draft
          fi
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
